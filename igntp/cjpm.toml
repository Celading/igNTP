[package]
  cjc-version = "1.1.3"
  name = "igntp"
  version = "0.2.0"
  output-type = "static"
  src-dir = "src"
  compile-option = "-Woff unused"
  license = "Apache-2.0"
  include = ["src", "README.md", "LICENSE", "NOTICE"]
  exclude = ["target", "build", "_helper", "scripts", "cangjie-repo.toml", "__pycache__", "*.pyc", "*.bak"]
  description = "SNTP v4 unicast client and timestamp calculations for Cangjie applications."
